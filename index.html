<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recepten</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f5f5f0;
    color: #222;
    min-height: 100vh;
  }

  header {
    background: #fff;
    border-bottom: 1px solid #e5e5e0;
    padding: 24px 32px;
    display: flex;
    align-items: center;
    gap: 16px;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  header h1 { font-size: 1.4rem; font-weight: 700; }
  #search {
    margin-left: auto;
    padding: 8px 14px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 0.95rem;
    width: 220px;
    outline: none;
    background: #f5f5f0;
  }
  #search:focus { border-color: #888; background: #fff; }

  #grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 20px;
    padding: 32px;
    max-width: 1400px;
    margin: 0 auto;
  }

  .card {
    background: #fff;
    border-radius: 14px;
    overflow: hidden;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    display: flex;
    flex-direction: column;
  }
  .card:hover { transform: translateY(-3px); box-shadow: 0 6px 20px rgba(0,0,0,0.12); }

  .card-img {
    width: 100%;
    height: 180px;
    object-fit: cover;
    display: block;
    background: #e8e8e0;
  }
  .card-img-placeholder {
    width: 100%;
    height: 180px;
    background: linear-gradient(135deg, #e8e8e0, #d5d5cc);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2.5rem;
  }
  .card-body {
    padding: 16px;
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .card-title { font-size: 1rem; font-weight: 600; line-height: 1.3; }
  .card-meta {
    display: flex;
    gap: 12px;
    font-size: 0.8rem;
    color: #777;
    margin-top: auto;
    padding-top: 8px;
  }
  .card-meta span { display: flex; align-items: center; gap: 4px; }

  /* Modal */
  #overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.45);
    z-index: 100;
    overflow-y: auto;
    padding: 40px 16px;
  }
  #overlay.open { display: flex; justify-content: center; align-items: flex-start; }

  #modal {
    background: #fff;
    border-radius: 18px;
    max-width: 720px;
    width: 100%;
    overflow: hidden;
    position: relative;
    animation: slideUp 0.2s ease;
  }
  @keyframes slideUp {
    from { transform: translateY(20px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }

  #modal-close {
    position: absolute;
    top: 14px; right: 14px;
    background: rgba(0,0,0,0.35);
    color: #fff;
    border: none;
    border-radius: 50%;
    width: 34px; height: 34px;
    font-size: 1.1rem;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    z-index: 10;
  }
  #modal-close:hover { background: rgba(0,0,0,0.6); }

  #modal-img {
    width: 100%;
    height: 280px;
    object-fit: cover;
    display: block;
    background: #e8e8e0;
  }
  #modal-img-placeholder {
    width: 100%;
    height: 200px;
    background: linear-gradient(135deg, #e8e8e0, #d5d5cc);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 4rem;
  }

  #modal-content { padding: 28px 32px 36px; }
  #modal-title { font-size: 1.6rem; font-weight: 700; margin-bottom: 10px; line-height: 1.2; }
  #modal-meta {
    display: flex;
    gap: 20px;
    font-size: 0.875rem;
    color: #666;
    margin-bottom: 28px;
    padding-bottom: 20px;
    border-bottom: 1px solid #eee;
  }
  #modal-meta span { display: flex; align-items: center; gap: 5px; }

  .section-title {
    font-size: 1rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: #444;
    margin-bottom: 12px;
  }

  #modal-ingredienten { margin-bottom: 28px; }
  .ingredient-group {
    font-weight: 600;
    font-size: 0.875rem;
    color: #555;
    margin: 12px 0 6px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .ingredient-list { list-style: none; display: flex; flex-direction: column; gap: 7px; }
  .ingredient-list li {
    font-size: 0.95rem;
    padding-left: 16px;
    position: relative;
  }
  .ingredient-list li::before {
    content: '';
    position: absolute;
    left: 0; top: 9px;
    width: 5px; height: 5px;
    border-radius: 50%;
    background: #aaa;
  }

  #modal-instructies { margin-bottom: 28px; }
  .step-list { list-style: none; display: flex; flex-direction: column; gap: 14px; }
  .step-list li {
    display: flex;
    gap: 14px;
    font-size: 0.95rem;
    line-height: 1.5;
  }
  .step-num {
    flex-shrink: 0;
    width: 26px; height: 26px;
    background: #222;
    color: #fff;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.75rem;
    font-weight: 700;
    margin-top: 1px;
  }

  #modal-tip {
    background: #f9f7f0;
    border-left: 3px solid #c8a84b;
    border-radius: 0 8px 8px 0;
    padding: 14px 16px;
    font-size: 0.9rem;
    line-height: 1.5;
    color: #555;
  }
  #modal-tip strong { display: block; margin-bottom: 4px; color: #333; }

  #modal-bron {
    margin-top: 20px;
    font-size: 0.8rem;
    color: #aaa;
    text-align: right;
  }

  .hidden { display: none !important; }
</style>
</head>
<body>

<header>
  <h1>🍽 Recepten</h1>
  <input type="text" id="search" placeholder="Zoeken..." oninput="filterRecipes()">
</header>

<div id="grid"></div>

<div id="overlay" onclick="closeIfOutside(event)">
  <div id="modal">
    <button id="modal-close" onclick="closeModal()">✕</button>
    <div id="modal-header"></div>
    <div id="modal-content">
      <h2 id="modal-title"></h2>
      <div id="modal-meta"></div>
      <div id="modal-ingredienten"></div>
      <div id="modal-instructies"></div>
      <div id="modal-tip-wrap"></div>
      <div id="modal-bron"></div>
    </div>
  </div>
</div>

<script>
const recipes = [{"title": "Biefstuktaco's met mangosalsa", "porties": "4", "tijd": "20 minuten", "bron": "Picnic", "cover": "", "ingredienten": ["2 biefstukken", "8 mini wraps (tortilla)", "1 mango", "1 komkommer", "3 limoenen", "1 rode peper", "400 g gesneden rode kool", "2,5 el olijfolie", "knoflook", "zwarte peper en zout"], "instructies": ["Haal 2 biefstukken een kwartiertje van tevoren uit de koelkast en laat op kamertemperatuur komen. Bestrooi de biefstuk aan beide kanten royaal met zout en peper.", "Verhit 2 el olijfolie in een koekenpan. Bak de biefstuk 3,5 minuut per zijde voor medium-rare en 5 minuten per zijde voor medium. Zet apart om te rusten.", "Snij 1 mango rondom de pit en lepel het vruchtvlees er voorzichtig uit. Snij zowel de mango als 1 komkommer in kleine blokjes. Pers 2 limoenen uit en snij 1 limoen in partjes.", "Snij 1 rode peper doormidden en haal (voor een minder pittige salsa) de zaadjes en zaadlijsten eruit. Hak de rode peper fijn.", "Roer naar smaak rode peper door de mango en komkommer. Breng de salsa op smaak met het limoensap, 0,5 el olijfolie en een snufje zout.", "Snij de biefstuk, tegen de draad in, in plakjes. Verwarm 8 kleine tortillawraps volgens de aanwijzingen op de verpakking.", "Beleg de tortillawraps eerst met de salsa, dan met 400 g rode kool en ten slotte met de plakjes biefstuk. Serveer met een partje limoen."], "tip": "Extra lekker smeuïg met plakjes avocado of een lepeltje crème fraîche."}, {"title": "Crispy taco's met kaas en gehakt", "porties": "4", "tijd": "20 minuten", "bron": "Picnic", "cover": "https://storefront-prod.nl.picnicinternational.com/static/images/recipes/25fc72c7e3501b679259106cd516aecefbdc994ef088f085c18df9424924d28b/filled-2000x2000.webp", "ingredienten": ["12 tacoschelpen", "400 g Mexicaanse roerbakgroenten", "200 g crème fraîche", "250 g geraspte kaas", "1 blik tomatenblokjes", "1 zakje tacokruidenmix", "500 g gemengd gehakt", "1 krop ijsbergsla", "2 el olijfolie", "2 teentjes knoflook", "zwarte peper en zout"], "instructies": ["Verwarm de oven voor op 200 graden. Pel en hak 2 teentjes knoflook fijn. Snij 1 krop ijsbergsla in reepjes.", "Verhit 2 el olijfolie in een ruime hapjespan, fruit hierin de knoflook en bak 500 g gehakt in 3 tot 4 minuten op hoge temperatuur bruin.", "Voeg 400 g Mexicaanse roerbakgroenten toe en bak deze 3 minuten mee met het gehakt.", "Voeg 1 zakje tacokruidenmix toe aan de pan en bak een minuutje mee. Giet 1 blik tomatenblokjes erbij in de pan. Laat even sudderen en breng op smaak met peper en zout.", "Verwarm ondertussen 12 tacoschelpen in de oven volgens de aanwijzing op de verpakking.", "Vul de taco's met het gehaktmengsel en maak af met de ijsbergsla, crème fraîche en geraspte kaas."], "tip": "Liever vega? Vervang het gehakt door een vega(n) variant. Serveer eventueel met jalapeños voor extra pit."}, {"title": "Falafelbowl met hummus en feta", "porties": "4", "tijd": "20 minuten", "bron": "Picnic", "cover": "https://storefront-prod.nl.picnicinternational.com/static/images/recipes/dfd8be86f55154382fd293c09aff59d25b196e9e0aa49995ac9d3ac8aff986db/filled-2000x2000.webp", "ingredienten": ["380 g spicy falafel", "150 ml knoflooksaus", "1 komkommer", "250 g cherrytomaatjes", "1 courgette", "150 g verse feta", "200 g pikante hummus", "275 g couscous", "3 el olijfolie", "zwarte peper en zout"], "instructies": ["Kook 275 g couscous volgens de aanwijzingen op de verpakking.", "Snij 1 komkommer in kleine blokjes en 1 courgette in plakjes. Halveer 250 g cherrytomaatjes. Verbrokkel 150 g feta.", "Verhit 1 el olijfolie in een brede koekenpan. Bak hierin de plakjes courgette aan beide zijden op hoge temperatuur (ongeveer 4 minuten). Breng op smaak met zout en peper. Haal de courgette uit de pan en zet opzij.", "Verhit in dezelfde pan 2 el olijfolie. Bak 380 g falafel hierin in ongeveer 5 minuten rondom bruin.", "Verdeel de couscous over de kommen. Bedek de couscous met de falafel, komkommer, courgette, tomaatjes, feta, knoflooksaus en hummus."], "tip": "Extra lekker hartig met een lepel kalamata-olijventapenade. De hummus is niet heel pittig, maar wil je 'm toch minder pikant? Kies dan voor de naturel hummus!"}, {"title": "Flatbread met doperwtenpesto en sticky halloumi", "porties": "4", "tijd": "20 minuten", "bron": "Picnic", "cover": "", "ingredienten": ["8 stuks brioche flatbreads", "450 g halloumi (2 pakjes)", "450 g erwten (diepvries)", "1 bosje basilicum", "400 g courgettespaghetti", "1 biologische citroen", "30 g Parmezaanse kaas poeder", "250 g zoete trostomaatjes", "1 snufje chilivlokken", "2 el honing", "1 el extra vergine olijfolie", "1 el olijfolie", "zwarte peper en zout"], "instructies": ["Verwarm de oven voor op 180°C (hetelucht) en verwarm 8 brioche flatbreads volgens de aanwijzingen op de verpakking. Breng een pan met gezouten water aan de kook en kook 450 g erwten (diepvries) in 5 minuten beetgaar. Giet af en spoel af met koud water.", "Maak de doperwtenpesto. Rasp de schil van 1 biologische citroen en pers het sap uit boven een hoge maatbeker. Voeg 15 g basilicum, 4 el extra vergine olijfolie, 30 g Parmezaanse kaas poeder en de helft van de erwten toe. Pureer met een staafmixer en breng op smaak met peper en zout.", "Doe de doperwtenpesto in een ruime kom en meng met 400 g courgettespaghetti en de overige erwten. Halveer 250 g zoete trostomaatjes en voeg toe. Breng op smaak met peper en zout.", "Snijd 450 g halloumi in plakken van ca. 0,5 cm. Verwarm 1 el olijfolie in een ruime koekenpan en bak de halloumi in ca. 5 minuten aan beide zijden goudbruin. Voeg de laatste minuut 2 el honing en eventueel een mespuntje chilivlokken toe.", "Beleg de flatbreads met de pesto-courgettesalade en de gebakken halloumi. Serveer direct."], "tip": ""}, {"title": "Groentestoof geitenkaas", "porties": "2", "tijd": "45 minuten", "bron": "Picnic", "cover": "", "ingredienten": ["1 groentestoof geitenkaas verspakket (bevat: wortel, aardpeer, pommes rouges, bleekselderij, sjalot, knoflook, tijm, rozemarijn, tomatenpuree, kruidenmix, tomaten, linzen)", "125 g geitenkaas", "1 stokbrood", "2 el olijfolie", "400 ml water"], "instructies": ["Verwarm de oven voor op 220 graden. Bak het stokbrood af volgens de aanwijzingen op de verpakking.", "Maak de groenten schoon. Pel de sjalot en knoflook, snipper de sjalot en snij de knoflook fijn. Schil de wortels, aardperen en pommes rouges met een dunschiller. Snij in de lengte doormidden en vervolgens in plakjes. Snij de bleekselderij in plakjes en de tomaten in stukken. Ris de blaadjes tijm en rozemarijn van de takjes en snij fijn. Laat de linzen uitlekken in een vergiet.", "Verhit 2 el olijfolie in een hapjespan en bak hierin de wortel, aardpeer, pommes rouges, bleekselderij, sjalot, knoflook, tijm en rozemarijn 5 minuten op hoge temperatuur.", "Voeg de tomatenpuree toe en bak 1 minuut mee op middelhoge temperatuur.", "Voeg de kruidenmix, tomaten en 400 ml water toe, breng aan de kook en laat 25-30 minuten afgedekt stoven tot de groente beetgaar is. Roer regelmatig door en voeg tijdens de laatste 3 minuten de linzen toe.", "Serveer de groentestoof met het stokbrood. Verbrokkel de geitenkaas over de groentestoof heen."], "tip": ""}, {"title": "Indiase rode linzenstoof met bloemkool en naan", "porties": "4", "tijd": "35 minuten", "bron": "Picnic", "cover": "https://storefront-prod.nl.picnicinternational.com/static/images/recipes/b89fca45dba9e381bf322e4e3e56ffdae214f50a4728dade0e786dda4b035ab7/large.png", "ingredienten": ["300 g rode linzen", "2 el garam masala", "500 g tomaten", "4 naanbroodjes", "400 g bloemkool", "1 ui", "600 ml groentebouillon", "400 ml kokosmelk", "1 el olijfolie"], "instructies": ["Verwarm de oven voor op 180 graden en bak 4 naanbroodjes af volgens de bereidingswijze op de verpakking.", "Spoel 300 g rode linzen af. Snij 400 g bloemkool in kleine roosjes, 500 g tomaten in partjes en snipper 1 ui.", "Verhit een scheutje olie in een grote pan en fruit de ui samen met 2 el garam masala. Maak 600 ml groentebouillon volgens de aanwijzingen op de verpakking en voeg deze samen met de rode linzen en 400 ml kokosmelk toe. Kook met de deksel op de pan gedurende 10 minuten. Roer regelmatig.", "Voeg de bloemkoolroosjes en de tomaten toe aan de pan. Kook het geheel nogmaals 10 minuten tot de linzen en bloemkool gaar zijn. Voeg optioneel een extra scheut water toe.", "Serveer de linzencurry met de naanbroodjes."], "tip": "Extra lekker met verse koriander. Ook lekker met (vega) kipstukjes — voeg deze toe tijdens stap 4 en laat ze mee sudderen."}, {"title": "Kipfajita's met avocadoyoghurt", "porties": "4", "tijd": "20 minuten", "bron": "Picnic", "cover": "", "ingredienten": ["400 g kipdijfiletreepjes", "3 paprika's", "1 zakje fajitakruiden", "6 el yoghurt", "1 avocado", "1 rode ui", "8 wraps", "2 el olijfolie", "zwarte peper en zout"], "instructies": ["Pel 1 rode ui en snij in dunne partjes. Snij 3 paprika's in smalle repen.", "Meng 400 g kipdijfiletreepjes in een kom met 1 el olijfolie, een half zakje fajitakruiden en een snuf peper en zout.", "Verhit 1 el olijfolie in een ruime koekenpan en bak de kipdijfiletreepjes 2 tot 3 minuten rondom op hoog vuur.", "Voeg de rode ui en paprikareepjes toe en bak nog eens 4 tot 5 minuten. Voeg ten slotte de resterende fajitakruiden toe, bak nog 1 minuut en breng op smaak met zout en peper.", "Halveer 1 avocado en verwijder de pit. Doe het vruchtvlees in een kom en schenk 6 el yoghurt bij. Prak de avocado en roer de yoghurt er goed doorheen. Breng op smaak met een snufje zout.", "Verwarm 8 wraps volgens de aanwijzingen op de verpakking. Vul de wraps met de kip-paprikavulling en serveer met de avocadoyoghurt."], "tip": "Extra lekker met geraspte kaas en tacosalsa. Liever vega? Vervang de kipdijfiletreepjes door vega kipstukjes. Liever extra vezels? Vervang de wraps voor een volkoren variant."}, {"title": "Kipschnitzel-wrap met tzatziki", "porties": "4", "tijd": "15 minuten", "bron": "Picnic", "cover": "", "ingredienten": ["4 kipschnitzels", "1 komkommer", "1 gele paprika", "4 trostomaten", "15 g dille", "125 g crème fraîche", "8 wraps", "1 el citroensap", "200 g ijsbergsla", "1 el olijfolie", "1 teentje knoflook", "zout en zwarte peper"], "instructies": ["Snij voor de tzatziki 1 komkommer in kleine blokjes. Meng in een kom met het sap van een halve citroen, 125 g crème fraîche en breng op smaak met peper en zout. Hak een bosje dille en 1 teentje knoflook fijn en roer door de saus.", "Snij 1 paprika in dunne ringen en 4 tomaten in plakken.", "Verwarm 1 el olijfolie in een koekenpan en bak hierin 4 kipschnitzels in 4 tot 6 minuten goudbruin en gaar. Breng eventueel op smaak met zout en peper.", "Verwarm 8 wraps in een droge koekenpan op hoog vuur, 1 minuut per kant.", "Snij de kipschnitzels in repen en verdeel deze samen met de paprika, tomaat en ijsbergsla over de wraps.", "Serveer de wraps met de tzatziki."], "tip": "Ook lekker met vers citroensap of volkoren wraps."}, {"title": "Linguine in rode pestosaus met kipgehakt", "porties": "4", "tijd": "20 minuten", "bron": "Picnic", "cover": "", "ingredienten": ["300 g kipgehakt gekruid", "400 g linguine", "4 el rode pesto", "500 g cherrytomaatjes", "200 g crème fraîche", "15 g basilicum", "2 uien", "1 teentje knoflook", "1 el olijfolie", "zout en zwarte peper"], "instructies": ["Breng een pan met ruim gezouten water aan de kook. Kook 400 g linguine volgens de aanwijzingen op de verpakking beetgaar. Bewaar een kopje kookvocht (ca. 250 ml).", "Verhit 1 el olijfolie in een hapjespan op middelhoog vuur en bak hierin 300 g gekruid kipgehakt 4 tot 5 minuten. Snijd in de tussentijd 2 uien en 1 teentje knoflook fijn. Voeg de ui en knoflook toe en bak de resterende tijd samen met het kipgehakt.", "Voeg 500 g cherrytomaatjes toe en bak 1 tot 2 minuten. Voeg 4 el rode pesto en 200 g crème fraîche toe. Roer goed om en voeg wat kookvocht toe om het sauzig te maken. Breng op smaak met peper en zout.", "Doe de linguine bij de saus en roer goed om. Pluk van 15 g basilicum de blaadjes en voeg toe aan de linguine. Serveer in diepe borden."], "tip": "Extra lekker met Parmezaanse kaas poeder."}, {"title": "Linzenschotel met katenspek", "porties": "2", "tijd": "30 minuten", "bron": "Project Gezond - Heerlijk Winter", "cover": "https://www.projectgezond.nl/content/uploads/2022/12/LinzenschotelKatenspek.png", "ingredienten": [], "instructies": ["Snipper de ui, snij de paprika en courgette in kleine blokjes en snij de katenspek in reepjes", "Fruit de ui aan in een pan op middelhoog vuur", "Voeg de paprika en katenspek toe", "Zet het vuur lager en bak de courgette mee", "Hak de knoflook fijn, voeg toe en bak kort mee", "Blus de groente af met de runderbouillon en voeg de linzen toe. Breng al roerend aan de kook", "Laat 15 minuten zachtjes koken met de deksel op de pan", "Snij de tomaten en feta in blokjes en hak de peterselie fijn", "Voeg de tomaat, feta en de helft van de peterselie toe", "Laat goed warm worden", "Maak op smaak met peper en zout en voeg de rest van de peterselie toe"], "tip": "Voeg de feta pas toe bij het opdienen voor een frissere smaak."}, {"title": "Maaltijdsalade met orzo en gerookte kip", "porties": "4", "tijd": "20 minuten", "bron": "Picnic", "cover": "", "ingredienten": ["170 g gerookte kipfilet", "2 appels", "150 g veldsla", "8 el slasaus", "1 komkommer", "2 baby avocado's", "275 g orzo", "zwarte peper en zout"], "instructies": ["Breng een pan met ruim water aan de kook en bereid 275 g orzo volgens de aanwijzingen op de verpakking. Giet hierna af en spoel ruim met koud water.", "Snij 1 komkommer in halve schijfjes en 2 appels in smalle partjes. Halveer 2 baby avocado's en verwijder de pit, snij daarna in blokjes.", "Meng in een ruime saladekom 150 g veldsla met de orzo, komkommer, appel, avocado en 170 g gerookte kipfilet. Breng de salade op smaak met de slasaus, peper en zout."], "tip": "Liever vega? Vervang de gerookte kipfilet door vega spekjes. Extra lekker met zongedroogde tomaatjes."}, {"title": "Mini-penne met ham en champ moen en sojasaus (voor erbij)"], "instructies": ["Bereid de noedels voor volgens de gebruiksaanwijzing, giet af en spoel af met koud water. Zet apart.", "Snijd de ui in stukjes, de paprika in reepjes, hak de knoflook, rasp de gember en snijd de broccoli in roosjes.", "Verwarm een pan met dikke bodem met een scheutje zonnebloemolie. Bak de ui, paprika en knoflook 3-4 minuten op middelhoog vuur. Voeg de rode curry pasta en gember toe en bak 1 minuut mee totdat de geuren vrijkomen.", "Roer de kippenbouillon, kokosmelk, pindakaas en broccoli erdoor. Breng aan de kook en laat 5 minuten koken totdat de broccoli beetgaar is. Voeg de noedels toe en serveer direct.", "Serveer met gesneden lente-ui, verse koriander, een partje limoen en een scheutje sojasaus."], "tip": "Op zoek naar nog meer inspiratie met rode curry pasta? Bekijk ook de Thaise soep met kip of de Thaise curry met vis."}, {"title": "Snelle noedels met runderreepjes", "porties": "4", "tijd": "20 minuten", "bron": "Picnic", "cover": "", "ingredienten": ["600 g udonnoedels", "300 g runderreepjes", "400 g Japanse wokgroenten", "250 g taugé", "woksaus teriyaki naar smaak", "1 el olijfolie", "zwarte peper en zout"], "instructies": ["Verhit 1 el olijfolie in een ruime wokpan en bak hierin 300 g runderreepjes 2 à 3 minuten op hoog vuur. Voeg de Japanse wokgroenten toe en bak nog eens 2 à 3 minuten.", "Schenk de woksaus naar smaak bij de groenten en runderreepjes, en laat het geheel even sudderen. Voeg 250 g taugé en de udonnoedels toe aan de pan en verhit al roerend. Breng op smaak met peper en zout."], "tip": "Liever vega? Vervang de runderreepjes door oosterse beefstukjes. Extra lekker met wat sesamzaadjes."}, {"title": "Zomerse quinoasalade met halloumi en mango", "porties": "4", "tijd": "20 minuten", "bron": "Picnic", "cover": "", "ingredienten": ["100 g kropslamix", "275 g quinoa", "400 g halloumi", "1 komkommer", "250 g cherrytomaatjes", "100 g amandelen", "1 mango", "1 citroen", "3 el olijfolie", "1 el wittewijnazijn", "peper en zout"], "instructies": ["Breng een pan water aan de kook. Kook 275 g quinoa volgens de aanwijzingen op de verpakking.", "Snij 1 komkommer in reepjes en halveer 250 g cherrytomaatjes. Snij 1 mango in blokjes.", "Rooster 100 g amandelen in een droge koekenpan goudbruin en hak ze grof.", "Snij 400 g halloumi in plakjes. Verhit 1 el olijfolie in een koekenpan en bak de halloumi in 2 minuten per kant goudbruin.", "Maak in een saladekom een dressing van 2 el olijfolie, 1 el wittewijnazijn, 1 tl citroensap en een snuf peper en zout.", "Meng 100 g kropslamix samen met de komkommer, cherrytomaatjes, mango en de quinoa door de dressing. Verdeel dan ook de halloumi over de salade."], "tip": "Liever met vlees? Voeg gerookte kipfiletplakjes toe. Extra lekker met blokjes avocado."}];

function emoji(recipe) {
  const t = recipe.title.toLowerCase();
  if (t.includes('pasta') || t.includes('linguine') || t.includes('penne') || t.includes('orzo') || t.includes('rigatoni')) return '🍝';
  if (t.includes('taco') || t.includes('fajita') || t.includes('wrap') || t.includes('quesadilla')) return '🌮';
  if (t.includes('salade') || t.includes('panzanella')) return '🥗';
  if (t.includes('soep')) return '🍜';
  if (t.includes('noedel') || t.includes('ramen') || t.includes('gyoza')) return '🍜';
  if (t.includes('pizza')) return '🍕';
  if (t.includes('bowl') || t.includes('falafel')) return '🥙';
  if (t.includes('kip') || t.includes('kipschnitzel')) return '🍗';
  if (t.includes('biefstuk')) return '🥩';
  if (t.includes('flatbread')) return '🫓';
  if (t.includes('curry') || t.includes('linzen')) return '🍛';
  return '🍴';
}

function renderGrid(list) {
  const grid = document.getElementById('grid');
  grid.innerHTML = list.map((r, i) => `
    <div class="card" onclick="openModal(${i})">
      ${r.cover
        ? `<img class="card-img" src="${r.cover}" alt="${r.title}" onerror="this.outerHTML='<div class=card-img-placeholder>${emoji(r)}</div>'">`
        : `<div class="card-img-placeholder">${emoji(r)}</div>`
      }
      <div class="card-body">
        <div class="card-title">${r.title}</div>
        <div class="card-meta">
          ${r.tijd ? `<span>⏱ ${r.tijd}</span>` : ''}
          ${r.porties ? `<span>👤 ${r.porties}</span>` : ''}
        </div>
      </div>
    </div>
  `).join('');
}

let filteredRecipes = [...recipes];

function filterRecipes() {
  const q = document.getElementById('search').value.toLowerCase();
  filteredRecipes = recipes.filter(r =>
    r.title.toLowerCase().includes(q) ||
    r.ingredienten.some(i => typeof i === 'string' && i.toLowerCase().includes(q))
  );
  renderGrid(filteredRecipes);
}

function openModal(idx) {
  const r = filteredRecipes[idx];

  // Header image
  const header = document.getElementById('modal-header');
  if (r.cover) {
    header.innerHTML = `<img id="modal-img" src="${r.cover}" alt="${r.title}" onerror="this.outerHTML='<div id=modal-img-placeholder>${emoji(r)}</div>'">`;
  } else {
    header.innerHTML = `<div id="modal-img-placeholder">${emoji(r)}</div>`;
  }

  document.getElementById('modal-title').textContent = r.title;

  document.getElementById('modal-meta').innerHTML = `
    ${r.tijd ? `<span>⏱ ${r.tijd}</span>` : ''}
    ${r.porties ? `<span>👤 ${r.porties} personen</span>` : ''}
    ${r.bron ? `<span>📖 ${r.bron}</span>` : ''}
  `;

  // Ingredienten
  let ingHtml = '<div class="section-title">Ingrediënten</div><ul class="ingredient-list">';
  r.ingredienten.forEach(item => {
    if (typeof item === 'object' && item.group) {
      ingHtml += `</ul><div class="ingredient-group">${item.group}</div><ul class="ingredient-list">`;
    } else {
      ingHtml += `<li>${item}</li>`;
    }
  });
  ingHtml += '</ul>';
  document.getElementById('modal-ingredienten').innerHTML = ingHtml;

  // Instructies
  const stepsHtml = '<div class="section-title">Instructies</div><ol class="step-list">' +
    r.instructies.map((s, i) => `<li><span class="step-num">${i+1}</span><span>${s}</span></li>`).join('') +
    '</ol>';
  document.getElementById('modal-instructies').innerHTML = stepsHtml;

  // Tip
  const tipWrap = document.getElementById('modal-tip-wrap');
  tipWrap.innerHTML = r.tip
    ? `<div id="modal-tip"><strong>Tip</strong>${r.tip}</div>`
    : '';

  document.getElementById('modal-bron').innerHTML = r.bron
    ? `Bron: ${r.bron}`
    : '';

  document.getElementById('overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  document.getElementById('overlay').classList.remove('open');
  document.body.style.overflow = '';
}

function closeIfOutside(e) {
  if (e.target === document.getElementById('overlay')) closeModal();
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

renderGrid(recipes);
</script>
